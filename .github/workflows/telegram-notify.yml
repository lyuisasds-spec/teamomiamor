name: Notificar actualización por Telegram

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje a Telegram
        run: |
          MESSAGE="Pagina actualizada hoy amor, te amoo 💗"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"

          for CHAT_ID in 8617899274 6910816114; do
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="${MESSAGE}"
          done
