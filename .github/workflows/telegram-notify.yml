name: Notificaciones Telegram

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
  schedule:
    # 03:00 UTC = 00:00 hora Argentina (UTC-3)
    # Formato cron: minuto hora día mes día-semana
    - cron: '0 3 21 9 *'
  workflow_dispatch: # para probar manualmente desde GitHub

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Detectar tipo de evento
        id: tipo
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mensaje=🌻 FELIZ 21 DE SEPTIEMBRE MI BEBITA MUAMUAMUA 💗🌻" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mensaje=🧪 Prueba manual del aviso 💗" >> $GITHUB_OUTPUT
          else
            echo "mensaje=Pagina actualizada hoy amor, te amoo 💗" >> $GITHUB_OUTPUT
          fi

      - name: Enviar mensaje a Telegram
        run: |
          MESSAGE="${{ steps.tipo.outputs.mensaje }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"

          for CHAT_ID in 8617899274 6910816114; do
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="${MESSAGE}"
          done
